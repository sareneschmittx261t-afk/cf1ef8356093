          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ql-planner -j2
      - run:
          name: Plan logical query
          command: LIONSS_LP=1 ./build/ql-planner --sql q.sql --optimize
